; PBZDamageLab hotkeys. Use UE4SS Key names: F1-F12, A-Z, ZERO-NINE, NUM_ZERO-NUM_NINE, INS (Insert), DEL (Delete), HOME, END, PAGE_UP, PAGE_DOWN ...
; Add "CTRL+", "SHIFT+" or "ALT+" in front to require a modifier, e.g. CTRL+F7.
; Avoid F10 and the ~ key (UE4SS console) and F11 (game fullscreen toggle). Restart the game after editing.
[Keybinds]
TogglePanel = F6
Summon = F7
Reset = F8
Remove = F9
SaveA = F1
SaveB = F2
SaveC = F3
ClearCompare = F4
; Combat mode: also count your damage to every enemy (bosses too), not only the dummy
CombatMode = INS
; Timed test: press, then the test starts on your first hit and runs for TimedSeconds
TimedTest = HOME
; Write this round's hits to a CSV file in the exports folder (only when you press it)
Export = END

[Test]
TimedSeconds = 30

[Debug]
; true = write every hit and its damage breakdown to UE4SS.log (for bug reports). Leave false normally.
Debug = false

[Panel]
; Auto = follow the game language (Chinese for zh, English otherwise), or force zh / en
Language = Auto
; TopRight, TopLeft
Position = TopRight
FontSize = 11
